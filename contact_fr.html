    <main>
        <section id="contact-form">
            <h2>Me contacter</h2>
            <p>
                Une question sur mes projets ou simplement envie de discuter ?
            <p>
            <p>
                Laissez-moi un message ici !
            <p>

            <form action="https://formspree.io/f/mkgknnno" method="POST">
                <div class="form-groupe">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="user_nom" required>
                </div>

                <div class="form-groupe">
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="user_email" required>
                </div>

                <div class="form-groupe">
                    <label for="message">Message :</label>
                    <textarea id="message" name="user_message" rows="8" required></textarea>
                </div>

                <div class="form-groupe">
                    <button type="submit" class="bouton-cta">Envoyer le message</button>
                </div>
            </form>

        </section>
    </main>
